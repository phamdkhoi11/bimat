<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siêu Phẩm Đập Bóng 3D</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .container {
            position: relative;
            text-align: center;
        }
        #gameCanvas {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .high-score { color: #f59e0b; }
        .current-score { color: #10b981; }
        p { margin: 0 0 10px 0; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="scoreboard">
            <span class="current-score">Điểm: <span id="scoreText">0</span></span>
            <span class="high-score">Kỷ lục: <span id="highScoreText">0</span></span>
        </div>
        <p>Chạm nhanh vào bóng để kích hoạt hiệu ứng nổ vỡ!</p>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        const highScoreText = document.getElementById("highScoreText");

        let score = 0;
        let highScore = localStorage.getItem("ballHighScore") || 0;
        highScoreText.innerText = highScore;

        let gameOver = false;
        let balls = [];
        let particles = [];
        let spawnTimer = 0;
        let spawnInterval = 50;

        // Bảng màu Gradient cao cấp cho bóng
        const colors = [
            { start: "#ff007f", end: "#79003e" }, // Hồng neon
            { start: "#00f6ff", end: "#006b70" }, // Xanh băng
            { start: "#faff00", end: "#858800" }, // Vàng chanh
            { start: "#00ff66", end: "#007a31" }, // Xanh lục bảo
            { start: "#cc00ff", end: "#5c0073" }, // Tím khói
            { start: "#ff6a00", end: "#913c00" }  // Cam lửa
        ];

        // Hàm tạo âm thanh giả lập bằng Web Audio API (Không cần tải file nhạc bên ngoài)
        function playPopSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300 + Math.random() * 400, audioCtx.currentTime); // Tần số ngẫu nhiên cho vui tai
            oscillator.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.15);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        function playGameOverSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        // Tạo bóng mới
        function createBall() {
            const radius = Math.random() * 12 + 18; 
            const colorPair = colors[Math.floor(Math.random() * colors.length)];
            balls.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: -radius,
                radius: radius,
                speed: Math.random() * 2 + 2.5 + (score * 0.05), // Tốc độ nhanh dần theo điểm số
                color: colorPair
            });
        }

        // Tạo hiệu ứng hạt nổ vỡ (Animation vỏ bóng tung té)
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 3 + 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    alpha: 1,
                    color: color
                });
            }
        }

        // Kiểm tra click đập bóng
        function checkHit(clickX, clickY) {
            if (gameOver) {
                resetGame();
                return;
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                const dist = Math.hypot(clickX - b.x, clickY - b.y);
                if (dist <= b.radius + 12) { 
                    playPopSound();
                    createExplosion(b.x, b.y, b.color.start);
                    balls.splice(i, 1);
                    score++;
                    scoreText.innerText = score;
                    
                    // Cập nhật kỷ lục ngay lập tức nếu vượt qua
                    if (score > highScore) {
                        highScore = score;
                        highScoreText.innerText = highScore;
                        localStorage.setItem("ballHighScore", highScore);
                    }
                    break;
                }
            }
        }

        canvas.addEventListener("mousedown", (e) => {
            const rect = canvas.getBoundingClientRect();
            checkHit(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener("touchstart", (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            checkHit(touch.clientX - rect.left, touch.clientY - rect.top);
            e.preventDefault();
        });

        function resetGame() {
            score = 0;
            scoreText.innerText = score;
            balls = [];
            particles = [];
            spawnInterval = 50;
            gameOver = false;
        }

        // Cập nhật dữ liệu
        function update() {
            if (gameOver) return;

            spawnTimer++;
            if (spawnTimer >= Math.max(15, spawnInterval - Math.floor(score / 5))) {
                createBall();
                spawnTimer = 0;
            }

            // Di chuyển bóng
            for (let i = 0; i < balls.length; i++) {
                balls[i].y += balls[i].speed;
                if (balls[i].y - balls[i].radius > canvas.height) {
                    gameOver = true;
                    playGameOverSound();
                }
            }

            // Xử lý hạt hiệu ứng nổ rơi rụng
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // Chịu lực hút trái đất nhẹ
                p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // Vẽ đồ họa
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ hiệu ứng nổ vỏ bóng trước
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            });

            // Vẽ các quả bóng dạng khối 3D đổ bóng
            balls.forEach(b => {
                ctx.beginPath();
                let gradient = ctx.createRadialGradient(
                    b.x - b.radius/3, b.y - b.radius/3, b.radius/10,
                    b.x, b.y, b.radius
                );
                gradient.addColorStop(0, b.color.start);
                gradient.addColorStop(1, b.color.end);
                
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color.start;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow
                ctx.closePath();
            });

            // Màn hình Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("BÓNG CHẠM NỀN!", canvas.width / 2, canvas.height / 2 - 40);

                ctx.fillStyle = "#fff";
                ctx.font = "18px Arial";
                ctx.fillText("Điểm của bạn: " + score, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = "#f59e0b";
                ctx.fillText("Kỷ lục hiện tại: " + highScore, canvas.width / 2, canvas.height / 2 + 40);

                ctx.fillStyle = "#38bdf8";
                ctx.font = "bold 16px Arial";
                ctx.fillText("BẤM VÀO ĐÂY ĐỂ VƯỢT KỶ LỤC", canvas.width / 2, canvas.height / 2 + 100);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
